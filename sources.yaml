- skill: plugins/stenswf/skills/visual-pr
  upstream: https://github.com/humanlayer/skills/tree/main/plugins/visual-pr/skills/visual-pr
  ref: "ca7c8088db69e315a8b2deea43820270457f8f3c"
  last_reviewed: "2026-10-08"
  status: diverged
  notes: "Ported near-verbatim (PRD #28), upstream file names kept. Adaptations: model-invocable with a one-line description; {SKILLBASE} -> relative paths; .humanlayer/tasks -> .stenswf/<N>/pr-description.md (fallback .stenswf/pr-<number>/description.md), complete published body always saved; scripts/workflow-issue.sh names the owning stenswf skill (ship, ship-light, apply) from branch identity only before creating PRs; Change outline may be one or two plain sentences when no view helps; scripts/pr-body.sh composes new bodies (evidence appended byte for byte), refreshes the marked region in place (bodies read as JSON via jq -j, so no newline drift) and conservatively migrates upstream-template bodies (CommonMark fences, closing keywords always kept); body-only mode with five explicit inputs and no gh calls for ship, ship-light and apply PRD-mode; template adds closing line, region markers and evidence slot; task-artifact fence and cloud permalink replaced by a local HTML aside."

